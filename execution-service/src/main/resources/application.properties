spring.application.name=execution-service

server.port=8086

spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=c##execution_db
spring.datasource.password=execution123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=5
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.executionService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.executionService.minimum-number-of-calls=2